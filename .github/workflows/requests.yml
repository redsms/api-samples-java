name: SMS requests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  requests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tests/test_requests.py
